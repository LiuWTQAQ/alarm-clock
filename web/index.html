<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title data-i18n="title">闹钟 · 远程控制</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs">
  <a href="#/" class="tab" data-view="home" data-i18n="tab_home">主页</a>
  <a href="#/settings" class="tab" data-view="settings" data-i18n="tab_settings">设置</a>
  <button id="logout" class="ghost mini" data-i18n="logout" title="退出登录">退出</button>
</nav>

<main>
  <!-- ------------------------------------------------ home -->
  <section id="view-home" class="view">
    <header class="hero">
      <div>
        <h1 id="devName">卧室闹钟</h1>
        <p class="sub"><span id="dot" class="dot"></span><span id="conn" data-i18n="connecting">连接中…</span></p>
      </div>
      <div class="clock"><span id="clock">--:--:--</span><small id="ampm"></small></div>
    </header>

    <div class="grid">
      <div class="col">
        <section class="card env">
          <div class="temp"><b id="temp">--</b><small id="unit">°C</small></div>
          <div class="muted" id="cond">—</div>
          <div class="muted small" id="place"></div>
        </section>

        <section class="card">
          <div class="row head"><h2 data-i18n="lamp">灯</h2><button id="lamp" class="toggle off">关</button></div>
          <p class="muted small" data-i18n="lamp_hint">继电器 · 卧室顶灯</p>
        </section>

        <section class="card">
          <div class="row head"><h2 data-i18n="ac">空调</h2><button id="ac" class="toggle off">关</button></div>
          <div class="row acrow">
            <button id="tmin" class="ghost">−</button>
            <span id="actemp">26 °C</span>
            <button id="tplus" class="ghost">+</button>
          </div>
          <p class="muted small" data-i18n="ac_hint">红外 · 房间空调</p>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="row head"><h2 data-i18n="alarms">闹钟</h2>
            <button id="addBtn" class="ghost" data-i18n="add">+ 新增</button></div>
          <ul id="alarms" class="list"></ul>
        </section>

        <section class="card">
          <h2 data-i18n="events">事件</h2>
          <ul id="events" class="list muted small"></ul>
        </section>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------ settings -->
  <section id="view-settings" class="view">
    <header class="hero">
      <div>
        <h1 data-i18n="settings">设置</h1>
        <p class="sub" data-i18n="settings_sub">偏好保存在云端，并下发到设备</p>
      </div>
    </header>

    <div class="grid">
      <div class="col">
        <section class="card form">
          <h2 data-i18n="sec_loc">位置与时间</h2>
          <label><span data-i18n="city">城市（决定天气）</span>
            <select id="sCity"></select>
          </label>
          <label><span data-i18n="tz">时区</span>
            <select id="sTz"></select>
          </label>
          <label><span data-i18n="hourfmt">时间格式</span>
            <select id="sHour">
              <option value="24" data-i18n="h24">24 小时制</option>
              <option value="12" data-i18n="h12">12 小时制</option>
            </select>
          </label>
          <label><span data-i18n="lang">语言</span>
            <select id="sLang">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </section>
      </div>

      <div class="col">
        <section class="card form">
          <h2 data-i18n="sec_disp">显示</h2>
          <label><span data-i18n="unit">温度单位</span>
            <select id="sUnit">
              <option value="c" data-i18n="uc">摄氏度 °C</option>
              <option value="f" data-i18n="uf">华氏度 °F</option>
            </select>
          </label>
          <label><span data-i18n="wx">天气刷新间隔</span>
            <select id="sWx">
              <option value="10" data-i18n="m10">10 分钟</option>
              <option value="30" data-i18n="m30">30 分钟</option>
              <option value="60" data-i18n="m60">60 分钟</option>
            </select>
          </label>
          <label><span data-i18n="name">设备名称</span>
            <input id="sName" maxlength="12">
          </label>
        </section>

        <section class="card form">
          <h2 data-i18n="sec_net">网络</h2>
          <p class="muted small" id="curSsid">—</p>
          <label><span data-i18n="ssid">Wi-Fi 名称（SSID）</span>
            <input id="sSsid" maxlength="32" autocomplete="off" placeholder="留空则不修改">
          </label>
          <label><span data-i18n="wpass">Wi-Fi 密码</span>
            <input id="sWpass" type="password" maxlength="64" autocomplete="new-password" placeholder="留空则保持原密码">
          </label>
          <button id="wifiBtn" class="primary" data-i18n="wifi_save">保存到设备</button>
          <p class="muted small" id="wifiMsg"></p>
          <p class="muted small" data-i18n="wifi_hint">下发后设备会断开并重连，约 5–10 秒。填错时可在设备本地页面（屏幕上的 IP）改回。</p>
        </section>

        <section class="card">
          <button id="saveSettings" class="primary" data-i18n="save">保存并下发</button>
          <p class="muted small" id="saveHint"></p>
        </section>
      </div>
    </div>
  </section>
</main>

<!-- ------------------------------------------------ alarm sheet -->
<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <header class="head">
      <button id="shCancel" class="circ" aria-label="cancel">✕</button>
      <h3 id="shTitle">编辑闹钟</h3>
      <button id="shSave" class="circ accent" aria-label="save">✓</button>
    </header>

    <div class="body">
      <div class="wheel">
        <div class="band"></div>
        <div class="wcol" id="wH"></div>
        <div class="wsep">:</div>
        <div class="wcol" id="wM"></div>
      </div>

      <div class="group">
        <button class="row tap" id="rRepeat"><span data-i18n="repeat">重复</span>
          <b id="vRepeat">永不</b><i class="chev">›</i></button>
      </div>
      <p class="hint" id="repeatHint" data-i18n="repeat_hint"></p>

      <div class="group">
        <label class="row"><span data-i18n="label">标签</span>
          <input id="vLabel" class="rin" maxlength="9" placeholder="闹钟"></label>
        <button class="row tap" id="rRing"><span data-i18n="ring">铃声</span>
          <b id="vRing">故事时间</b><i class="chev">›</i></button>
        <div class="row"><span data-i18n="snooze">稍后提醒</span>
          <label class="switch"><input type="checkbox" id="vSnooze" checked><span></span></label></div>
        <button class="row tap" id="rSnoozeMin"><span data-i18n="snooze_len">稍后提醒时长</span>
          <b id="vSnoozeMin">9 分钟</b><i class="chev">›</i></button>
      </div>

      <button class="row danger" id="shDelete" data-i18n="delete_alarm">删除闹钟</button>
    </div>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="panel">
      <header class="head">
        <button id="pkClose" class="circ">✕</button>
        <h3 id="pkTitle"></h3>
        <span class="circ blank"></span>
      </header>
      <div class="body" id="pkBody"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
