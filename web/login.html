<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>登录 · 闹钟远程控制</title>
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:26px 24px 22px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#22d3ee,#0e7490);
    display:grid;place-items:center;color:#04222a;font-weight:700;font-size:17px}
  .login h1{font-size:17px;margin:0}
  .login .sub{margin:2px 0 0;color:var(--dim);font-size:12.5px}
  .field{display:block;margin-bottom:13px}
  .field span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
  .field input{width:100%;padding:12px 13px;font-size:16px;border-radius:11px;
    background:#0d1015;border:1px solid var(--line);color:var(--text);outline:none;
    transition:border-color .15s, box-shadow .15s}
  .field input:focus{border-color:#1c6b7d;box-shadow:0 0 0 3px #0e3b4433}
  .err{min-height:18px;color:#ff7b72;font-size:12.5px;margin:0 0 10px}
  .login button[type=submit]{width:100%;padding:13px;border-radius:11px;border:0;font-size:15.5px;
    font-weight:700;letter-spacing:2px;background:var(--acc);color:#04222a;cursor:pointer;
    transition:filter .15s}
  .login button[type=submit]:hover{filter:brightness(1.08)}
  .login button[type=submit]:disabled{opacity:.55;cursor:default}
  .foot{margin:16px 0 0;text-align:center;color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<form class="login" id="f" autocomplete="on">
  <div class="brand">
    <div class="mark">闹</div>
    <div>
      <h1>闹钟 · 远程控制</h1>
      <p class="sub">ESP32 远程闹钟</p>
    </div>
  </div>

  <label class="field"><span>用户名</span>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
  </label>
  <label class="field"><span>密码</span>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
  </label>

  <div class="err" id="err"></div>
  <button id="go" type="submit">登 录</button>
  <p class="foot">登录状态保持 7 天</p>
</form>

<script>
const f = document.getElementById('f'), err = document.getElementById('err'),
      go = document.getElementById('go');
document.getElementById('u').focus();

f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = ''; go.disabled = true; go.textContent = '登录中…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: f.username.value.trim(), password: f.password.value})
    });
    if (r.ok) { location.replace('/'); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = r.status === 429 ? '尝试次数过多，请稍后再试' : (j.detail || '登录失败');
  } catch {
    err.textContent = '网络错误，请检查连接';
  }
  go.disabled = false; go.textContent = '登 录';
});
</script>
</body>
</html>
