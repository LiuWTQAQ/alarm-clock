[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv

; ---- 串口：走板载 CH343（UART0），既能烧录也能看日志 ----
monitor_speed = 115200
upload_port  = /dev/cu.usbmodem5D2F0343251
monitor_port = /dev/cu.usbmodem5D2F0343251
monitor_filters = default, time

; ---- 依赖 ----
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.0.9

; ---- TFT_eSPI 的引脚（与 docs/hardware.md 一致）----
build_flags =
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=27000000
    -DLOAD_FONT7