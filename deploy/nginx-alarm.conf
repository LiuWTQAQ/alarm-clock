# /etc/nginx/conf.d/alarm.conf
# 只新增一个 server 块，不改动 WordPress 的配置。

server {
    listen 80;
    server_name alarm.yoshino-liuwt.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name alarm.yoshino-liuwt.top;

    # 腾讯云免费证书（下载后放在 /etc/nginx/ssl/）
    ssl_certificate     /etc/nginx/ssl/alarm.yoshino-liuwt.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/alarm.yoshino-liuwt.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/alarm.access.log;
    error_log  /var/log/nginx/alarm.error.log;

    client_max_body_size 6m;          # 背景图上传留余量

    location = /index.html { add_header Cache-Control "no-store"; }
    location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
